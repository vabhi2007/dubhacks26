packages:
  - apps/*
  - packages/*
  - scripts
allowBuilds:
  esbuild: true
  unrs-resolver: true
  protobufjs: false  # via spectrum-ts → grpc; its postinstall is only a version warning
  pnpm: true

# One React for the whole workspace (Next pins 19.3.0). Mismatched copies crash the extension side panel.
overrides:
  react: 19.3.0
  react-dom: 19.3.0
